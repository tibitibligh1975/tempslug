<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Inicial</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .container {
            text-align: center;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .button {
            background-color: #00C853;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #14A351;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: #484848; margin-bottom: 20px;">Gerar Link de Checkout</h2>
        <button class="button" onclick="generateCheckout()">Gerar Checkout</button>
    </div>
    <script>
        async function generateCheckout() {
            try {
                const response = await fetch('/generate-checkout');
                const data = await response.json();
                if (data.url) {
                    window.location.href = data.url;
                }
            } catch (error) {
                console.error('Erro ao gerar checkout:', error);
            }
        }
    </script>
</body>
</html>
